<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Note: 'unsafe-eval' is needed for webpack-dev-server in development -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:3001 ws://0.0.0.0:3001;">
  <title>Physical Therapy Clinic Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      overflow: hidden;
    }
    #root {
      width: 100vw;
      height: 100vh;
    }

    /* Print Styles */
    @media print {
      /* Hide everything except printable content */
      body {
        overflow: visible !important;
        background: white !important;
      }

      #root > *:not(.print-container) {
        display: none !important;
      }

      .print-container {
        display: block !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        background: white !important;
      }

      .printable-invoice {
        padding: 20px !important;
        max-width: 100% !important;
        margin: 0 !important;
      }

      /* Ensure table borders print */
      .printable-invoice table {
        border-collapse: collapse !important;
      }

      .printable-invoice th,
      .printable-invoice td {
        border: 1px solid #ddd !important;
        padding: 8px !important;
      }

      .printable-invoice th {
        background-color: #f5f5f5 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide interactive elements */
      button, .MuiButton-root {
        display: none !important;
      }

      /* Page settings */
      @page {
        margin: 0.5in;
        size: A4;
      }
    }

    /* Screen: hide print container by default */
    @media screen {
      .print-container {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
