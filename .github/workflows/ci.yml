name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - run: npm run rebuild

      - name: Type check (renderer)
        run: npx tsc --noEmit -p tsconfig.webpack.json

      - name: Type check (main)
        run: npx tsc --noEmit -p tsconfig.main.json

      - name: Run tests
        run: npm test -- --no-coverage
